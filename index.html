<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Tenis e Sneakers Online</title>

  <meta name="description"

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components/header.css">

  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/product-category.css">
  <link rel="stylesheet" href="./css/components/product-grid.css">
</head>

<body>
  <header class="header">
    <h1 class="logo">
      <a href="" title="SyntaxWear - Tenis e Sneakers Online">
        <img src="./images/logo/logo.svg" alt="SyntaxWear - Tenis e Sneakers Online ">
      </a>
    </h1>

    <nav class="nav-center" aria-label="Categorias Principais">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul>
    </nav>

    <nav class="nav-right" aria-label="Acesso rápido">
      <ul>
        <li><a href="#">Nossas lojas</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#"><img src="./images/icons/user.svg" alt="Minha conta"></a></li>
        <li><a href="#" aria-label="Ajuda">
            <img src="./images/icons/help.svg" alt="Ajuda">
          </a></li>
        <li><a href="#" aria-label="Carrinho">
            <img src="./images/icons/bag.svg" alt="Carrinho">
          </a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero-section">
      <div class="hero-overlay">
        <div class="hero-content">
          <span class="hero-subtitle">Krypton One</span>
          <h2 class="hero-title">Transforme qualquer espaço em presença</h2>


          <div class="hero-buttons">
            <a class="btn btn-outline" href="#">Ver modelos</a>
            <a class="btn btn-filled" href="#">Comprar</a>
          </div>
        </div>
      </div>
    </section>

    <section id="categorias" class="categories-section">


      <div class="category-card casual">
        <a class="category-link" href="#">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Casual</span>
        </a>
      </div>

      <div class="category-card esporte">
        <a class="category-link" href="#">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Esporte</span>
        </a>
      </div>

      <div class="category-card moderno">
        <a class="category-link" href="#">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Moderno</span>
        </a>
      </div>

      <div class="category-card futurista">
        <a class="category-link" href="#">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Futurista</span>
        </a>
      </div>


    </section>

    <section id="destaques" class="grid-section">
      <div class="card highlight">
        <div class="top1-content">
          <h3 class="card-title">Krypton One</h3>
          <p class="card-subtitle">Estilo Urbano com atitude</p>
          <div class="cta-group">
            <a class="btn btn-outline" href="#">Feminino</a>
            <a class="btn btn-filled" href="#">Masculino</a>
          </div>
        </div>
      </div>
      <div class="card sneaker-purple"></div>
      <div class="card model"></div>
      <div class="card sneaker-color"></div>
      <div class="card sneaker-white"></div>
      <div class="card sneaker-silver"></div>
    </section>

  <footer id="contato" class="site-footer" aria-labelledby="footer-title">

  </footer>
